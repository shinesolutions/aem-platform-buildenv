---
name: CI
on:
  # Branches only: release tags are already built by the publish workflows
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
# Cancel a branch's in-progress run when a newer commit is pushed, main
# excepted so that every main commit keeps a complete CI result
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  build:
    # Same-repo PRs are already built by the push run on their branch, so only
    # run for PRs from forks
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    # Fail a hung build instead of running to GitHub's 6 hour default
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          set-safe-directory: ${{ github.workspace }}
      - uses: cliffano/command-docker-action@v2.1.0
        with:
          command: make ci arch=${{ matrix.arch }}
          image: shinesolutions/the-works-buildenv:4.7.0
          shell: bash
