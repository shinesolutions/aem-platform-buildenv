---
name: Publish Docker Base
'on':
  push:
    tags:
      - '*'
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: shinesolutions
          password: ${{ secrets.SHINEOPENSOURCE_GITHUB_TOKEN }}
      - uses: cliffano/command-docker-action@v2.0.0
        with:
          image: shinesolutions/the-works-buildenv:3.0.5
          shell: bash
          command: >
            make clean deps lint build-docker-base && \

            cat logs/aem-platform-buildenv-base.log && \

            docker --version && \

            echo '${{ secrets.SHINEOPENSOURCE_DOCKERHUB_TOKEN }}' | docker login --username shinesolutions --password-stdin && \

            docker inspect shinesolutions/aem-platform-buildenv && \

            make publish-docker-base
